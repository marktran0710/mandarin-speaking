<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>慢慢中文 · Teacher Studio</title>
  <!-- Keep in sync with index.html — both entries share src/index.css, so a
       family fetched by one and not the other renders differently per entry.
       Noto Serif TC (Ming/明體) carries Chinese display type, Noto Sans TC the
       Chinese body/UI, and Source Sans 3 all Latin and pinyin — including
       ǖ ǘ ǚ ǜ, which most Latin faces omit. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
  />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/teacher-main.tsx"></script>
</body>

</html>
