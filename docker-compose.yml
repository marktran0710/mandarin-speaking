# Retired: this used to run a standalone local Postgres for the backend,
# but its `db` service and docker-compose.dev.yml's `db` service both bound
# the same host port (127.0.0.1:5433) to two DIFFERENT named volumes. Same
# DATABASE_URL, silently different data depending on which one happened to
# be running - that's what caused the CLI/UI dataset split fixed 2026-09-26.
#
# Use docker-compose.dev.yml's db service instead (same host port, one
# volume, one dataset):
#   docker compose -f docker-compose.dev.yml up -d db
services: {}
