databases:
  - name: mandarin-postgres
    plan: free
    databaseName: mandarin
    user: mandarin

services:
  - type: web
    name: mandarin-speaking-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandarin-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://marktran0710.github.io
      - key: OPENAI_FEEDBACK_MODEL
        value: gpt-4o-mini
      - key: GEMINI_FEEDBACK_MODEL
        value: gemini-2.0-flash
      # Set this to a persistent mounted path when the hosting plan provides
      # a disk. Without it, PostgreSQL rows survive but uploaded audio/images
      # do not survive a container replacement.
      - key: UPLOAD_DIR
        value: /data/uploads
