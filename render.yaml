databases:
  - name: mandarin-postgres
    plan: basic-256mb
    databaseName: mandarin
    user: mandarin

services:
  - type: web
    name: mandarin-speaking-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile.production
    plan: starter
    healthCheckPath: /health/ready
    disk:
      name: mandarin-speaking-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandarin-postgres
          property: connectionString
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_FEEDBACK_MODEL
        value: gpt-4o-mini
      - key: GEMINI_FEEDBACK_MODEL
        value: gemini-2.0-flash
      # Set this to a persistent mounted path when the hosting plan provides
      # a disk. Without it, PostgreSQL rows survive but uploaded audio/images
      # do not survive a container replacement.
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: REMOTE_MEDIA_ALLOWED_HOSTS
        value: oaidalleapiprodscus.blob.core.windows.net,pollinations.ai,image.pollinations.ai
      - key: DB_POOL_MIN
        value: "2"
      - key: DB_POOL_MAX
        value: "10"
      - key: ANALYZE_CONCURRENCY_LIMIT
        value: "1"
      - key: ANALYZE_QUEUE_LIMIT
        value: "16"
